# Sayım uygulamasının (APK) bulutta derlenmesi: bilgisayara Android Studio kurmadan.
# Kullanım: bu klasörün tamamını kendi (özel/private) GitHub deponuza yükleyin ->
#           Actions sekmesi -> "APK derle" -> Run workflow -> bitince "SayimUygulamasi-apk" çıktısını indirin.
name: APK derle
on:
  workflow_dispatch: {}
  push:
    paths:
      - "android/**"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: APK derle
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: SayimUygulamasi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
